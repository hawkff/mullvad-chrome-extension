name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  attach-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Attach the production build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The zip carries bundled code, so it needs the GPL and the bundled packages' MIT notices.
          cp LICENSE NOTICE.md dist/production/
          mkdir dist/production/licenses
          for pkg in react react-dom scheduler tldts tldts-core; do
            cp "node_modules/$pkg/LICENSE" "dist/production/licenses/$pkg.txt"
          done
          (cd dist/production && zip -qr "$GITHUB_WORKSPACE/mullvad-proxy-$TAG.zip" .)
          gh release upload "$TAG" "mullvad-proxy-$TAG.zip" --repo "$GITHUB_REPOSITORY"
